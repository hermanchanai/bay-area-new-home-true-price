# Priority counties. Assessor endpoints and field names come from the 2026-10-26 probes
# (verified live that day); re-check with ?f=json before relying on a field.
# conforming_limit_1unit: FHFA 2026 one-unit limit. Alameda / Contra Costa / Santa Clara
# $1,249,125 per secondary sources; San Joaquin not yet confirmed (null = no jumbo adjustment).

counties:
  - name: Alameda
    fips: "06001"
    conforming_limit_1unit: 1249125
    assessor:
      status: green
      parcels: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Parcels/FeatureServer/0
      transfers: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Assessor_Office_Ownership_Transfer_List/FeatureServer/0
      fields: {apn: APN, address: SitusAddress, land: Land, imps: Imps, deed_date: LatestDocumentDate, use: UseCode}
      sfr_use_codes: ["1100", "1800"]

  - name: Contra Costa
    fips: "06013"
    conforming_limit_1unit: 1249125
    assessor:
      status: green
      parcels: https://gis.cccounty.us/arcgis/rest/services/CCMAP/Assessment_Parcels_ArcPro/MapServer/0
      fields: {apn: APN, address: full_address_display, land: LAND_VALUE, imps: IMP_VAL, deed_date: C_DED_DT, use: USE_CODE}
      sfr_use_codes: ["11"]

  - name: Santa Clara
    fips: "06085"
    conforming_limit_1unit: 1249125
    assessor:
      status: red  # no free values; asking prices and incentives only

  - name: San Joaquin
    fips: "06077"
    conforming_limit_1unit: null
    assessor:
      status: green
      parcels: https://services2.arcgis.com/GQhSReJEO6f7tsvy/ArcGIS/rest/services/Parcels/FeatureServer/0
      fields: {apn: APN, address: FULL_ADDRESS, land: LAND_VALUE, imps: IMPROVEMENT_VALUE, year_built: YEAR_BUILT, roll_year: VALUE_ROLL_YEAR, use: USECODE}
      sfr_use_codes: ["10"]
