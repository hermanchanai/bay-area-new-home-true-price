# Priority counties. Assessor endpoints and field names come from the 2026-10-26 probes and were
# re-checked live with ?f=json on 2026-10-27.
# conforming_limit_1unit: FHFA 2026 one-unit limit, from FHFA's county file
# (fullcountyloanlimitlist2026_hera-based_final_flat.xlsx, read 2026-11-03).
# San Mateo, Solano, Sonoma and Napa added 2026-11-03: listings and incentives only, assessors not pulled.
#
# assessor.universe_where: the parcels we pull — single-family homes built or sold since 2022,
# which covers every phase of the communities selling now. Counts on 2026-10-27:
# Alameda 80,524 · Contra Costa 61,689 · San Joaquin 12,951 · Alameda transfers 60,467.
#
# assessor.past_sales: when a parcel's published value counts as reset to its last sale (tools/link_parcels.py).
#   roll_fy: the roll's fiscal year, shown with each value. Alameda's 14,520 priced transfers show value = price × 1.02^n with
#     n = July-1 rolls since the sale, for a 2025-26 roll (checked 2026-10-27); Contra Costa's round-
#     thousand values fall on the same steps. San Joaquin's layer says VALUE_ROLL_YEAR 2026 (2026-27).
#   reassessed_through: deeds after this date mostly still carry the seller's value (round-price share
#     drops from ~40% to ~12% in 2026), so their value is not shown (a recorded price still is).
#   sale_date: deed, or year_built where the layer has no deed date (San Joaquin).
#   newness: parcels universe filter + APN book-page pattern, to drop book-pages of older homes.

counties:
  - key: alameda
    name: Alameda
    fips: "06001"
    conforming_limit_1unit: 1249125
    assessor:
      status: green
      parcels: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Parcels/FeatureServer/0
      universe_where: "UseCode IN ('1100','1800') AND LatestDocumentDate >= DATE '2022-01-01'"
      centroid: server
      transfers: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Assessor_Office_Ownership_Transfer_List/FeatureServer/0
      transfers_where: "name_type = 'TRANSFEREE' AND use_cd IN ('1100','1800')"
      past_sales: {roll_fy: 2025, reassessed_through: "2025-12-31", sale_date: deed,
                   newness: {where: "UseCode IN ('1100','1800')", apn_like: "{bp}-%"}}

  - key: contra_costa
    name: Contra Costa
    fips: "06013"
    conforming_limit_1unit: 1249125
    assessor:
      status: green
      parcels: https://gis.cccounty.us/arcgis/rest/services/CCMAP/Assessment_Parcels_ArcPro/MapServer/0
      universe_where: "USE_CODE = 11 AND C_DED_DT >= '20220101'"
      centroid: geometry  # MapServer: no returnCentroid, average the simplified ring instead
      past_sales: {roll_fy: 2025, reassessed_through: "2025-12-31", sale_date: deed,
                   newness: {where: "USE_CODE = 11", apn_like: "{bp}%"}}

  - key: santa_clara
    name: Santa Clara
    fips: "06085"
    conforming_limit_1unit: 1249125
    assessor:
      status: red  # no free values; asking prices and incentives only

  - key: san_joaquin
    name: San Joaquin
    fips: "06077"
    conforming_limit_1unit: 832750
    assessor:
      status: green
      parcels: https://services2.arcgis.com/GQhSReJEO6f7tsvy/ArcGIS/rest/services/Parcels/FeatureServer/0
      universe_where: "USECODE = '10' AND YEAR_BUILT >= '2022'"
      centroid: server
      past_sales: {roll_fy: 2026, sale_date: year_built}   # universe is already new homes only

  - key: san_mateo
    name: San Mateo
    fips: "06081"
    conforming_limit_1unit: 1249125
    assessor: {status: red}

  - key: solano
    name: Solano
    fips: "06095"
    conforming_limit_1unit: 832750
    assessor: {status: red}

  - key: sonoma
    name: Sonoma
    fips: "06097"
    conforming_limit_1unit: 897000
    assessor: {status: red}

  - key: napa
    name: Napa
    fips: "06055"
    conforming_limit_1unit: 1017750
    assessor: {status: red}
