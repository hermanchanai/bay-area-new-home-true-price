# Model providers, prices and spend caps. tools/llm.py reads this; nothing here is a secret.
# Prices are USD per 1M tokens, from https://dev.meta.ai/docs/pricing-rate-limits (read 2026-10-27).
# A model without a price is refused: the budget guard can't bound a call it can't price.

providers:
  meta:
    base_url: https://api.meta.ai/v1
    key_env: META_API_KEY
    # Hard cap on cumulative spend recorded in llm_calls, of the $150 event credit.
    cap_usd: 120
    # Per UTC day (tools/daily_refresh.py, Herman 2026-10-28). Unchanged pages hit the cache and cost $0.
    daily_cap_usd: 1.00
    models:
      muse-spark-1.3: {input: 1.25, cached_input: 0.15, output: 4.25}
      # Same model; "contributor" mode lets Meta train on the request. We only send public
      # builder pages, so that's acceptable here, and it's 12x cheaper. 150 RPM limit.
      muse-spark-1.3-contributor: {input: 0.10, cached_input: 0.002, output: 0.20}
  # Muse Spark Open (open weights). Both hosts list it at the same price as Muse Spark standard
  # (baseten.co/library/muse-spark-open, fireworks.ai/models/fireworks/muse-spark-open, read 2026-10-28).
  baseten:
    base_url: https://inference.baseten.co/v1
    key_env: BASETEN_API_KEY
    cap_usd: 5
    models:
      meta-models/muse-spark-open-1026: {input: 1.25, cached_input: 0.15, output: 4.25}
  fireworks:
    base_url: https://api.fireworks.ai/inference/v1
    key_env: FIREWORKS_API_KEY
    cap_usd: 5
    models:
      accounts/fireworks/models/muse-spark-open: {input: 1.25, cached_input: 0.15, output: 4.25}

# Per-purpose defaults. Reasoning tokens bill as output, so effort is a cost lever.
purposes:
  extract:
    provider: meta
    model: muse-spark-1.3-contributor
    reasoning_effort: low
    max_completion_tokens: 32000
  escalate:
    provider: meta
    model: muse-spark-1.3
    reasoning_effort: medium
    max_completion_tokens: 32000
  extract_open:      # Muse Spark Open (open weights) on the same pages, for the eval comparison
    provider: fireworks
    model: accounts/fireworks/models/muse-spark-open
    reasoning_effort: low
    max_completion_tokens: 32000
  vision:            # floor-plan images (tools/read_floorplan.py)
    provider: meta
    model: muse-spark-1.3-contributor
    reasoning_effort: low
    max_completion_tokens: 8000
  agent:            # buyer questions with tools (tools/agent.py). Contributor mode for our own eval questions;
                    # the live site's choice (visitors' questions) is decided with the Day 7 deploy.
    provider: meta
    model: muse-spark-1.3-contributor
    reasoning_effort: low
    max_completion_tokens: 6000
  agent_open:       # the same agent on Muse Spark Open (open weights), for the eval comparison
    provider: fireworks
    model: accounts/fireworks/models/muse-spark-open
    reasoning_effort: low
    max_completion_tokens: 6000
  agent_live:       # visitors' questions on the live site: Muse Spark Open (open weights) on Fireworks, which
                    # doesn't log or store prompts for open models (docs.fireworks.ai data handling, read 2026-10-28).
                    # 20/20 on the agent eval (eval/reports/2026-10-28__agent__agent_open.md).
    provider: fireworks
    model: accounts/fireworks/models/muse-spark-open
    reasoning_effort: low
    max_completion_tokens: 6000
  ping:
    provider: meta
    model: muse-spark-1.3-contributor
    reasoning_effort: minimal
    max_completion_tokens: 200

# Live site guards (tools/server.py). Spend is summed from the server's own llm_calls ledger (purpose
# agent_live), which restarts empty on each deploy; the daily cap is the backstop that survives that.
live:
  daily_cap_usd: 2.00
  total_cap_usd: 10.00
  per_ip_per_hour: 8
  per_ip_per_day: 25
  max_question_chars: 500

# Pre-call input estimate: characters per token (low = conservative = higher estimate).
chars_per_token: 3.0
