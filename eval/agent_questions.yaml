# Agent eval: 20 buyer questions with hand-checked answers (tools/eval_agent.py scores them).
# Derived 2026-10-27 from the loaded DB with SQL written separately from tools/agent_tools.py, not from agent
# output. Homes are matched by address (or lot), so a reload that renumbers ids keeps the truth valid; a data
# refresh that changes prices or listings means re-deriving it.
# - top3_any_of / top3_all_of: homes the answer must rank in its first 3 [H<id>] citations
# - eligible: every home meeting all the question's conditions; nothing else may be in the top 3
#   (true price = the guaranteed end, asking minus offers every buyer gets; "ready by" = the builder's date)
# - must_mention: text the answer must contain (a list = any one of them), case-insensitive
# - no_homes: the right answer is "none"; citing any home fails
# Hand-computed values: q13 1576 Torrey Dr at 10% down: its "$80,000 in Savings" is Pulte's FLEX Cash already
#   applied (re-derived 2026-10-28), so only the 4.99% 7/6 ARM counts, worth $63,798 -> true price $653,417.
#   q04 (re-derived 2026-10-28): the biggest "up to" discount, $250,000, is on 8 homes that show no savings yet. q14 337 E Beatrice Ave at 5% down: ARM worth
#   $74,169 (market 7.32%, FRED 2026-10-22). q10 Cairnway median $804,200 (n 43). q11 Orchard Grove $1,320,100.
#   q16 Driftway: Residence 1, 1X, 2, 3 all have a downstairs bedroom. q17 Residence 1X owner's suite 14' x 14' 5".
