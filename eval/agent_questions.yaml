# Agent eval: 20 buyer questions with hand-checked answers (tools/eval_agent.py scores them).
# Derived by tools/derive_agent_truth.py from the frozen DB named in `db` (data as published on 2026-11-03),
# with SQL written apart from tools/agent_tools.py. The eval's tools query that same copy, so the daily refresh
# can't make the key stale; re-freeze and re-derive to move the eval to newer data.
# - top3_any_of / top3_all_of: homes the answer must rank in its first 3 [H<id>] citations
# - eligible: every home meeting all the question's conditions; nothing else may be in the top 3
#   (true price = true_high, asking minus offers with "up to" at $0; "ready by" = the builder's date)
# - must_mention: text the answer must contain (a list = any one of them), case-insensitive
# - must_mention_amount: per group, the answer states one of these dollar amounts at its written precision
#   ($54.8k counts as $54,806); must_name: a name that must appear whole ('Residence 1' is not in 'Residence 1X')
# - no_homes: the right answer is "none"; citing any home fails
# - q04: top 3 with "up to" offers at $0 or in full; q07: cheapest by true price or by asking
# Hand-computed values (ARM worth = points to buy the rate from ARM par, market less 0.50%, one point per 0.25%;
# loan = price less 20% down; market 7.24% FRED 2026-10-29):
#   q09 Lilac at Oakwood Trails offers: $75,000 in Savings; $80,000 in Savings; 4.99% / 5.892% APR 7/6 ARM rate fixed for 7 years on select quick move-in homes; Appliance Package; Honoring Our Hometown Heroes $2,000 incentive. The ARM is worth $40,164, $45,086, $47,062 on its homes at 20% down (an answer must name what it is worth, not only the rate; the up-to $250K FLEX Cash offer ended 10-30).
#   q10 Cairnway median assessed value $820,284 (n 43); an answer must call it an assessed value, not a sale price or an estimate.
#   q11 Orchard Grove median assessed value $1,346,502 (n 15); an answer must call it an assessed value, not a sale price or an estimate.
#   q13 1576 TORREY DR at 20% down: 4.99% ARM worth $40,164 -> true price $677,051 (asking $717,215).
#   q14 361 E Beatrice Avenue at 20% down: 4.99% ARM worth $44,416 -> true price $748,730 (asking $793,146).
#   q16 Driftway plans with a downstairs bedroom: Residence 1, Residence 1X, Residence 2, Residence 3.
#   q17 3139 Workman Avenue owner's suite 14' x 14' 5".
